name: npm dist-tag

# Manual, out-of-band tool for repointing an npm dist-tag (e.g. fixing `latest`
# after a publish landed on a channel tag only). Does not touch any in-repo
# version carriers, does not create git tags or commits — it only calls
# `npm dist-tag add` against an already-published version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Already-published version to point the tag at (e.g. 1.0.0-alpha.10)'
        required: true
      tag:
        description: 'npm dist-tag to move'
        required: true
        default: 'latest'

jobs:
  set-dist-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - name: Set dist-tag
        run: npm dist-tag add "rad-orc@${{ inputs.version }}" "${{ inputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
