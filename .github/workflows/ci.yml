# .github/workflows/ci.yml — Run every adapter + integration tests on every PR.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repo-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies (root workspace)
        run: npm install

      - name: Build lib/repo-registry
        run: npm run build -w @rad-orchestration/repo-registry

      - name: Test lib/repo-registry
        run: npm test -w @rad-orchestration/repo-registry

      - name: Root workspace guard tests (by-name resolution, workspace linkage, CI wiring)
        run: node --test tests/*.test.mjs

      - name: Build-helper structural tests (tests/)
        run: node --test harness-installers/shared/build-helpers/tests/*.test.mjs

      - name: Build-helper structural tests (__tests__/)
        run: node --test harness-installers/shared/build-helpers/__tests__/*.test.mjs

      - name: UI smoke route test (library resolves by-name inside Next app server)
        working-directory: ui
        run: node --test --import tsx "app/api/registry-smoke/route.test.ts"

  work-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies (root workspace)
        run: npm install

      - name: Build lib/repo-registry (work-graph dependency)
        run: npm run build -w @rad-orchestration/repo-registry

      - name: Build lib/work-graph
        run: npm run build -w @rad-orchestration/work-graph

      - name: Test lib/work-graph
        run: npm test -w @rad-orchestration/work-graph

  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies (root workspace)
        run: npm install

      - name: Build lib/telemetry
        run: npm run build -w @rad-orchestration/telemetry

      - name: Test lib/telemetry
        run: npm test -w @rad-orchestration/telemetry

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Guard delivered payload (no dev-only skills/tests leaked)
        run: node tests/check-delivered-payload.mjs

      - name: Install dependencies (root workspace)
        run: npm install

      - name: Build lib/repo-registry (ui dependency)
        run: npm run build -w @rad-orchestration/repo-registry

      - name: Build lib/telemetry (ui dependency)
        run: npm run build -w @rad-orchestration/telemetry

      - name: Build UI (next build)
        working-directory: ui
        run: npm run build

  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install adapter engine dependencies (yaml)
        working-directory: harness-adapters/engine
        run: npm install

      - name: Adapter unit tests (each capability surface)
        run: node --test harness-adapters/engine/__tests__/*.test.mjs

      - name: Install shared build-helpers dependencies (esbuild)
        working-directory: harness-installers/shared/build-helpers
        run: npm install

      - name: Smoke build all harnesses against canonical source
        run: node harness-dogfood/build.js --all

  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies (root workspace)
        run: npm install

      # Standard installer manifests are GENERATED path catalogs
      # ({ bundlePath, destinationPath } per file — no hashes). Rebuild and fail
      # if the committed manifests are stale; with no per-file hash the gate only
      # fires when a file is added, removed, renamed, or re-homed (UI build
      # skipped — it is not in the manifest, so manifests are byte-identical
      # without it, on any OS).
      - name: Standard installer — manifest drift gate
        run: npm run check:manifest-drift -w harness-installers/standard

      # Installer test suites (never gated before). The plugin suites include the
      # new manifest-payload-parity test: the plugin manifests are hand-authored
      # catalogs the build copies verbatim, so a git-diff gate can't see drift —
      # the parity test builds the real runtime-config and asserts the staged
      # _install-source/ matches the catalog in both directions.
      - name: Standard installer tests
        run: npm test -w harness-installers/standard

      - name: Claude plugin tests
        run: npm test -w harness-installers/claude-plugin

      - name: Copilot CLI plugin tests
        run: npm test -w harness-installers/copilot-cli-plugin

      - name: Copilot VS Code plugin tests
        run: npm test -w harness-installers/copilot-vscode-plugin
